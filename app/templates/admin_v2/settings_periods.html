{% extends 'admin_v2/base.html' %}
{% block title %}Тарифы{% endblock %}
{% block content %}
<section class="page-stack">
  <section class="panel settings-card">
    <div class="panel-head">
      <div><span class="eyebrow">Тарифная сетка</span><h2>Добавить период</h2></div>
    </div>
    <form class="server-form" method="post" action="/admin/settings/periods/create">
      <label><span>Код</span><input name="code" placeholder="30" required></label>
      <label><span>Название</span><input name="label" placeholder="30 дней" required></label>
      <label><span>Дней</span><input name="days" type="number" placeholder="пусто = бессрочно"></label>
      <label><span>Цена</span><input name="price" type="number" step="0.01" value="0"></label>
      <label><span>Сортировка</span><input name="sort_order" type="number" value="100"></label>
      <label class="check"><input type="checkbox" name="is_active" value="1" checked> Активен</label>
      <button>Добавить тариф</button>
    </form>
  </section>

  <section class="config-list">
    {% for p in periods %}
    <article class="server-card">
      <form method="post" action="/admin/settings/periods/{{ p.id }}/update">
        <div class="server-head">
          <div><h3>{{ p.label }}</h3><p class="mono">{{ p.code }}</p></div>
          <span class="pill {% if p.is_active %}paid{% else %}canceled{% endif %}">{% if p.is_active %}активен{% else %}выключен{% endif %}</span>
        </div>
        <div class="server-form edit">
          <label><span>Код</span><input name="code" value="{{ p.code }}" required></label>
          <label><span>Название</span><input name="label" value="{{ p.label }}" required></label>
          <label><span>Дней</span><input name="days" type="number" value="{% if p.days is not none %}{{ p.days }}{% endif %}" placeholder="Пусто = бессрочно"></label>
          <label><span>Цена</span><input name="price" type="number" step="0.01" value="{{ p.price }}"></label>
          <label><span>Сортировка</span><input name="sort_order" type="number" value="{{ p.sort_order }}"></label>
          <label class="check"><input type="checkbox" name="is_active" value="1" {% if p.is_active %}checked{% endif %}> Активен</label>
          <button>Сохранить</button>
        </div>
      </form>
      <div class="actions"><form method="post" action="/admin/settings/periods/{{ p.id }}/delete" onsubmit="return confirm('Удалить период?');"><button>Удалить</button></form></div>
    </article>
    {% else %}
    <article class="server-card empty-state">Периоды не добавлены</article>
    {% endfor %}
  </section>
</section>
{% endblock %}
