{% extends 'base.html' %}
{% block content %}
<section class="auth-layout">
  <div class="access-card auth-copy">
    <span class="eyebrow">Telegram recovery</span>
    <h1>Восстановление пароля через Telegram</h1>
    <p>Введите код, который бот отправил в привязанный Telegram. Код действует 15 минут.</p>
  </div>
  <div class="access-card auth-panel">
    {% if sent %}<div class="alert success">Код отправлен в Telegram.</div>{% endif %}
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/telegram/reset/confirm" class="form-stack">
      <label><span>Логин</span><input name="username" value="{{ username }}" required autocomplete="username"></label>
      <label><span>Код из Telegram</span><input name="code" required maxlength="16" autocomplete="one-time-code"></label>
      <label><span>Новый пароль</span><input name="new_password" type="password" required minlength="6" autocomplete="new-password"></label>
      <label><span>Повтор нового пароля</span><input name="new_password_repeat" type="password" required minlength="6" autocomplete="new-password"></label>
      <button class="btn primary full" type="submit">Сменить пароль</button>
    </form>
  </div>
</section>
{% endblock %}
